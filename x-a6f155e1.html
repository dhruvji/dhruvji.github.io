<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>study</title>
<style>
  :root {
    --paper: #F7F6F2; --ink: #1C1B19; --raw: #9A968C; --mem: #39483D; --amber: #E7B26C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 56px 20px;
  }
  .wrap { width: 100%; max-width: 1040px; }
  h1 {
    font-family: "EB Garamond", Garamond, "Iowan Old Style", Georgia, serif;
    font-weight: 400; font-size: 40px; letter-spacing: -0.01em; margin: 0 0 6px;
  }
  .sub { color: #6b6860; margin: 0 0 28px; font-size: 15px; }
  .hero {
    position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
    cursor: crosshair; touch-action: pan-y; user-select: none;
  }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero canvas.overlay { pointer-events: none; }
  .zones {
    position: relative; height: 18px; margin-top: 12px;
    font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--raw);
    letter-spacing: 0.02em;
  }
  .zones span { position: absolute; top: 0; white-space: nowrap; }
  .zones .z1 { left: 0; }
  .zones .z2 { left: 44%; }
  .zones .z3 { left: 68%; }
  .zones b { font-weight: 400; color: var(--mem); }
  .key { margin-top: 18px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a877f; }
  .key i { display: inline-block; width: 10px; height: 8px; margin: 0 4px 0 14px; vertical-align: 0; }
  .key i:first-child { margin-left: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Learning a workspace</h1>
  <p class="sub">Read it, take notes, train what matters into memory.</p>
  <div class="hero" id="hero">
    <canvas id="gl"></canvas>
    <canvas id="overlay" class="overlay"></canvas>
  </div>
  <div class="zones">
    <span class="z1">workspace — emails · memos · sheets</span>
    <span class="z2">notes</span>
    <span class="z3">memory — <b id="epoch">epoch 000 · reward 0.000</b></span>
  </div>
  <div class="key">
    <i style="background:var(--raw)"></i>unread
    <i style="background:var(--amber)"></i>noted
    <i style="background:var(--mem)"></i>in weights
    &nbsp;&nbsp;— hover the workspace to read, hover memory to recall
  </div>
</div>

<script>
(() => {
  // ---------------------------------------------------------------- config
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const CFG = {
    cell: [6, 11],          // glyph cell, CSS px
    paper: hex('#F7F6F2'),
    raw: hex('#9A968C'),    // unread corpus text
    ink: hex('#1C1B19'),    // read / distilled
    mem: hex('#39483D'),    // memory lattice
    amber: hex('#E7B26C'),  // highlighter / reward
    flow: 6.5,              // stream speed, cells per second
    epochSec: 5,            // RL epoch length
    trailScale: 1 / 3,
    trailRadius: 0.05,
    trailDecay: 0.95,
    displace: 0.035,
    maxNotes: 4,
    autoplay: true,
    maxDpr: 2,
  };
  // Layout in uv space (shared by shader + overlay).
  const MEM_X0 = 0.68, MEM_X1 = 0.985, SQUEEZE = 0.5;
  const bandY0 = 0.5 - 0.47 * SQUEEZE, bandY1 = 0.5 + 0.47 * SQUEEZE;

  const hero = document.getElementById('hero');
  const canvas = document.getElementById('gl');
  const overlay = document.getElementById('overlay');
  const epochEl = document.getElementById('epoch');
  const octx = overlay.getContext('2d');

  const gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: false, stencil: false,
    desynchronized: true, powerPreference: 'high-performance',
  });
  if (!gl) { hero.textContent = 'WebGL2 not supported'; return; }
  const HDR = !!gl.getExtension('EXT_color_buffer_float');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------------------------------------------------------- atlas layout
  const RAMP = [' ', '·', '.', ':', '-', '=', '+', '*', '#', '%', '@'];
  const LETTERS = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const DIGITS = '0123456789'.split('');
  const GLYPHS = [...RAMP, ...LETTERS, ...DIGITS, '█'];
  // Knowledge-work vocabulary, bucketed by length (2..11) for the shader.
  const LEXICON = `re to cc of on by in as at we or it if do
    fyi doc kpi due ask roi eod log key fix faq ops new top win why how est
    memo note task plan spec deck sync wiki file team goal docs lead term deal fact rule case risk owner
    idea list flag edit read cite link tags call next step date
    draft brief audit scope email notes agent query recap index terms focus asset learn study
    claim chart model draft facts rules cited agree point asked board
    thread review policy budget report search status digest ticket intake matter clause source
    recall memory weight minute answer action follow update client signal skills
    meeting summary roadmap backlog context project insight reading archive handoff finding outline process
    library careful learned compile thought session
    decision analysis research schedule priority document workflow template feedback evidence playbook takeaway quarterly
    synthesis knowledge precedent reference checklist inference objective retrieval highlight deadline
    annotation discussion governance compliance onboarding milestones conclusion background understand
    stakeholder methodology deliverable spreadsheet information distillation`.split(/\s+/).filter(Boolean);
  const WORDS_PER = 32;
  const IDX = { ramp: 0, rampN: RAMP.length, let: RAMP.length, dig: RAMP.length + 26, block: GLYPHS.length - 1, n: GLYPHS.length };

  // ---------------------------------------------------------------- shaders
  function buildWords() {
    const buckets = {};
    for (const w of new Set(LEXICON)) {
      if (!/^[a-z]+$/.test(w) || w.length < 2 || w.length > 11) continue;
      (buckets[w.length] ||= []).push(w);
    }
    const data = new Uint8Array(12 * 10 * WORDS_PER);
    for (let L = 2; L <= 11; L++) {
      const list = buckets[L];
      if (!list) throw new Error('no words of length ' + L);
      for (let k = 0; k < WORDS_PER; k++) {
        const w = list[k % list.length];
        for (let c = 0; c < L; c++) data[((L - 2) * WORDS_PER + k) * 12 + c] = IDX.let + (w.charCodeAt(c) - 97);
      }
    }
    return data;
  }

  const VERT = `#version 300 es
  void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;
  const VERT_UV = `#version 300 es
  out vec2 vUv;
  void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    vUv = p;
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;
  const CODEC = HDR ? `
  vec3 dec(vec4 c) { return c.xyz; }
  vec4 enc(vec3 v) { return vec4(v, 1.0); }` : `
  vec3 dec(vec4 c) { return vec3(c.xy * 2.0 - 1.0, c.z); }
  vec4 enc(vec3 v) { return vec4(v.xy * 0.5 + 0.5, v.z, 1.0); }`;

  const TRAIL_FRAG = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform sampler2D uPrev;
  uniform vec2 uPts[16];
  uniform int uN;
  uniform float uAspect, uRadius, uDecay, uSpeed;
  ${CODEC}
  float sdSeg(vec2 p, vec2 a, vec2 b) {
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
    return length(pa - ba * h);
  }
  void main() {
    vec2 asp = vec2(uAspect, 1.0);
    vec3 f = dec(texture(uPrev, vUv));
    f = dec(texture(uPrev, vUv - f.xy * 0.006 / asp));
    f *= uDecay;
    for (int i = 0; i < 15; i++) {
      if (i >= uN - 1) break;
      vec2 a = uPts[i], b = uPts[i + 1];
      vec2 mv = (b - a) * asp;
      float L = length(mv);
      if (L < 1e-6) continue;
      float d = sdSeg(vUv * asp, a * asp, b * asp);
      float w = exp(-(d * d) / (uRadius * uRadius));
      f.xy = mix(f.xy, (mv / L) * uSpeed, w * 0.6);
      f.z = max(f.z, w * uSpeed);
    }
    o = enc(vec3(clamp(f.xy, -1.0, 1.0), clamp(f.z, 0.0, 1.0)));
  }`;

  const MAIN_FRAG = `#version 300 es
  precision highp float;
  out vec4 o;
  uniform vec2 uRes, uCellPx, uMouse;
  uniform float uTime, uFlow, uAspect, uDisplace, uProg, uSweep, uMouseOn;
  uniform vec4 uMarks[8];          // xy = uv (top-left), z = alpha, w = half-width in cells
  uniform sampler2D uTrail, uAtlas, uWords;
  uniform vec3 uPaper, uRaw, uInk, uMem, uAmber;
  ${CODEC}
  const float RAMP0 = ${IDX.ramp}.0, RAMPN = ${IDX.rampN}.0, LET0 = ${IDX.let}.0,
              DIG0 = ${IDX.dig}.0, BLOCK = ${IDX.block}.0, ATLASN = ${IDX.n}.0;
  const float MEMX0 = ${MEM_X0}, SQ = ${SQUEEZE};

  float h21(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  float vn(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x),
               mix(h21(i + vec2(0, 1)), h21(i + 1.0), f.x), f.y);
  }

  void main() {
    vec2 fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
    vec2 cellF = fc / uCellPx, cellI = floor(cellF), local = fract(cellF);
    vec2 G = uRes / uCellPx;
    vec2 uv = (cellI + 0.5) / G;
    vec2 asp = vec2(uAspect, 1.0);

    vec3 tr = dec(texture(uTrail, vec2(uv.x, 1.0 - uv.y)));
    float dens = tr.z;
    vec2 p = uv - vec2(tr.x, -tr.y) * uDisplace;
    float x = p.x, t = uTime;

    // funnel: the full-height workspace narrows into the memory band
    float sq = mix(1.0, SQ, smoothstep(0.34, MEMX0 - 0.02, x));
    float turb = (vn(vec2(x * 3.0 - t * 0.25, p.y * 5.0)) - 0.5) * 0.07 * (1.0 - smoothstep(0.25, 0.6, x));
    float yl = 0.5 + (p.y - 0.5 + turb) / sq;
    float lens = uMouseOn * smoothstep(0.11, 0.02, length((uv - uMouse) * asp));

    float g = 0.0;           // glyph index
    vec3 ink = uRaw;
    float hl = 0.0;          // highlighter amount
    vec3 hlC = uAmber;

    bool inBand = yl > 0.03 && yl < 0.97;

    if (x < MEMX0 && inBand) {
      // ---------------- workspace -> notes
      float row = floor(yl * G.y);
      float docRow = floor(row / 6.0);
      float rIn = row - docRow * 6.0;
      bool textRow = rIn < 5.0;
      float xs = floor(x * G.x - t * uFlow - docRow * 13.0);   // integer cells so words align
      float docSpan = 44.0;
      float docK = floor(xs / docSpan);
      float inDoc = xs - docK * docSpan;
      float docH = h21(vec2(docRow, docK));
      float type = floor(docH * 3.0);                    // 0 email, 1 memo, 2 sheet
      bool header = rIn == 0.0;
      bool sheet = type == 2.0 && !header;
      // two words per slot: [a letters] _ [b letters] _ , so spacing stays single and words never split
      float S = sheet ? 7.0 : 9.0 + floor(h21(vec2(row, docK)) * 7.0);       // 9..15
      float pos = inDoc - 2.0;
      float slot = floor(pos / S);
      float sp = pos - slot * S;
      float a = sheet ? 5.0 : 2.0 + floor(h21(vec2(slot, row + docK * 3.0)) * (S - 5.0));
      float b = S - 2.0 - a;
      bool first = sp < a;
      float L = first ? a : b;
      float ci = first ? sp : sp - a - 1.0;
      float wSeed = slot * 2.0 + (first ? 0.0 : 1.0) + docK * 17.0;
      float wh = h21(vec2(wSeed, row));                     // per-word hash
      float ragged = floor(h21(vec2(row, docK * 7.0)) * (type == 0.0 ? 2.0 : 1.0) + 0.5);
      float nSlots = floor((docSpan - 4.0) / S) - ragged;
      if (header) nSlots = 1.0;
      bool onWord = sp != a && sp < S - 1.0 && !(sheet && !first);

      if (textRow && pos >= 0.0 && slot < nSlots && onWord) {
        float cx = floor(xs);
        float letter;
        if (sheet) {
          letter = DIG0 + floor(h21(vec2(cx, row)) * 10.0);
        } else {
          float wRow = (L - 2.0) * ${WORDS_PER}.0 + floor(h21(vec2(wSeed, row + 0.5)) * ${WORDS_PER}.0);
          letter = floor(texelFetch(uWords, ivec2(int(ci), int(wRow)), 0).r * 255.0 + 0.5);
        }
        g = letter;
        ink = header ? mix(uRaw, uInk, 0.55) : uRaw;

        float dz = smoothstep(0.36, MEMX0 - 0.04, x);   // distillation progress
        bool key = wh < 0.16 || (header && wh < 0.45);   // salient words
        if (key) {
          hl = smoothstep(0.36, 0.46, x) * 0.65;
          ink = mix(ink, uInk, smoothstep(0.34, 0.46, x));
          if (x > MEMX0 - 0.06) { g = BLOCK; ink = uMem; hl = 0.0; }   // compressed into a unit
        } else {
          if (wh < dz * 1.05) g = RAMP0 + 1.0;            // detail dissolves to '·'
          if (x > MEMX0 - 0.07) g = 0.0;
        }
        // reading lens: full text comes back into focus
        if (lens > 0.01 && x < MEMX0 - 0.03) {
          g = letter;
          ink = mix(ink, uInk, lens);
          hl = max(hl, lens * (key ? 0.75 : 0.28));
        }
        // a quick pass of attention leaves fresh notes behind
        if (wh > 0.55 && x < MEMX0 - 0.05) {
          hl = max(hl, dens * 0.7);
          ink = mix(ink, uInk, dens);
        }
      }
    } else if (x >= MEMX0 && inBand && x < ${MEM_X1}) {
      // ---------------- memory lattice (weights)
      float colOn = step(mod(cellI.x, 2.0), 0.5);
      float h = h21(cellI * 1.37);
      float learned = step(h, uProg);
      float w = vn(cellI * vec2(0.21, 0.33) + vec2(0.0, t * 0.12));
      w = mix(0.05, 0.2 + 0.8 * w, learned);
      float sw = uSweep >= 0.0 ? smoothstep(2.5, 0.0, abs(uv.x - uSweep) * G.x) : 0.0;
      // recall: knowledge under the cursor surfaces at full strength
      w = max(w, lens * (0.55 + 0.45 * h) * learned);
      g = colOn * (RAMP0 + 1.0 + floor(clamp(w, 0.0, 0.999) * (RAMPN - 1.0)));
      ink = mix(uMem, uInk, lens * 0.5);
      hl = sw * 0.55 * learned;                                          // reward pass
      hl = max(hl, smoothstep(0.02, 0.0, uProg - h) * learned * 0.6);   // just learned
      if (lens > 0.9 && colOn > 0.5) g = BLOCK;
    }

    // marks: note targets in memory / recalled sources in the workspace
    for (int i = 0; i < 8; i++) {
      vec4 m = uMarks[i];
      if (m.z <= 0.0) continue;
      vec2 d = abs(uv - m.xy) * G;
      if (d.x < m.w && d.y < 0.6) {
        hl = max(hl, m.z * 0.8);
        ink = mix(ink, uInk, m.z);
        if (g == RAMP0 + 1.0 || g == 0.0) g = m.w > 1.0 ? LET0 + floor(h21(cellI) * 26.0) : BLOCK;
      }
    }

    float cov = g > 0.5 ? texture(uAtlas, vec2((g + local.x) / ATLASN, local.y)).r : 0.0;
    vec3 base = mix(uPaper, hlC, clamp(hl, 0.0, 1.0));
    o = vec4(mix(base, ink, cov), 1.0);
  }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vert, frag) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vert));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name.replace('[0]', '');
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  }
  const trailProg = program(VERT_UV, TRAIL_FRAG);
  const mainProg = program(VERT, MAIN_FRAG);
  gl.bindVertexArray(gl.createVertexArray());

  const wordsTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, wordsTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 12, 10 * WORDS_PER, 0, gl.RED, gl.UNSIGNED_BYTE, buildWords());
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  // ---------------------------------------------------------------- resources
  let W = 0, H = 0, dpr = 1, cellPx = [6, 11], cellCss = [6, 11];
  let trail = [], trailW = 0, trailH = 0, ping = 0, atlasTex = null;

  function makeTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, HDR ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA,
      HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.viewport(0, 0, w, h);
    HDR ? gl.clearColor(0, 0, 0, 1) : gl.clearColor(0.5, 0.5, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fb };
  }

  function buildAtlas(cw, ch) {
    const a = document.createElement('canvas');
    a.width = cw * IDX.n; a.height = ch;
    const x = a.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, a.width, a.height);
    x.fillStyle = '#fff';
    x.font = `${Math.max(6, Math.round(ch * 0.78))}px ui-monospace, SFMono-Regular, Menlo, monospace`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    GLYPHS.forEach((g, i) => {
      if (i === IDX.block) {
        const inset = Math.round(ch * 0.2);
        x.fillRect(i * cw, inset, cw, ch - inset * 2);
      } else x.fillText(g, i * cw + cw / 2, ch / 2 + ch * 0.02);
    });
    if (atlasTex) gl.deleteTexture(atlasTex);
    atlasTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, a);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  function resize() {
    const r = hero.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDpr);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (w === W && h === H) return;
    W = w; H = h;
    canvas.width = overlay.width = W;
    canvas.height = overlay.height = H;
    cellPx = [Math.max(2, Math.round(CFG.cell[0] * dpr)), Math.max(3, Math.round(CFG.cell[1] * dpr))];
    cellCss = [cellPx[0] / dpr, cellPx[1] / dpr];
    buildAtlas(cellPx[0], cellPx[1]);
    trail.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); });
    trailW = Math.max(2, Math.round(W * CFG.trailScale));
    trailH = Math.max(2, Math.round(H * CFG.trailScale));
    trail = [makeTarget(trailW, trailH), makeTarget(trailW, trailH)];
  }

  // ---------------------------------------------------------------- input
  let pending = [], lastPt = null, pointer = null, inside = false, lastInput = -1e9;
  function pushEvent(e) {
    const r = hero.getBoundingClientRect();
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    for (const ev of (list && list.length ? list : [e])) pending.push([ev.clientX - r.left, ev.clientY - r.top]);
    pointer = pending[pending.length - 1];
    inside = true;
    lastInput = performance.now();
  }
  const moveEvt = 'onpointerrawupdate' in window ? 'pointerrawupdate' : 'pointermove';
  hero.addEventListener(moveEvt, pushEvent, { passive: true });
  hero.addEventListener('pointerdown', pushEvent, { passive: true });
  hero.addEventListener('pointerleave', () => { inside = false; lastPt = null; });

  // ---------------------------------------------------------------- notes + recall
  const rand = s => { s = Math.sin(s * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const NOTE_KINDS = ['memo', 'email', 'sheet', 'filing', 'thread', 'precedent', 'clause'];
  let notes = [], nextId = 1;
  let recall = { a: 0, key: null, x: 0, y: 0, srcs: [], conf: 0 };

  function snap(v, c) { return Math.floor(v / c) * c; }

  function updateNotes(p, v, dt, cssW, cssH) {
    const TRACK_R = 0.09 * cssH, MIN_SPACING = 0.07 * cssH;
    const fed = new Set();
    const inWorkspace = p && p[0] < (MEM_X0 - 0.06) * cssW;
    if (inWorkspace && v > 0.15) {
      let best = null, bd = Infinity;
      for (const b of notes) {
        const d = Math.hypot(b.x - p[0], b.y - p[1]);
        if (d < bd) { bd = d; best = b; }
      }
      const target = Math.min(110, 26 + v * 26);
      if (best && bd < TRACK_R) {
        best.x += (p[0] - best.x) * 0.3;
        best.y += (p[1] - best.y) * 0.3;
        best.target = Math.max(best.target, target);
        best.life = 1; fed.add(best);
      } else if (!best || bd > MIN_SPACING) {
        if (notes.length >= CFG.maxNotes) { notes.sort((a, b) => a.life - b.life); notes.shift(); }
        const id = nextId++;
        const [cw, ch] = cellCss;
        const tx = (MEM_X0 + 0.02 + rand(id) * (MEM_X1 - MEM_X0 - 0.04)) * cssW;
        const ty = (bandY0 + 0.03 + rand(id + 9.1) * (bandY1 - bandY0 - 0.06)) * cssH;
        const n = {
          id, x: p[0], y: p[1], size: 8, target, life: 1, aspect: 0.55 + rand(id + 3) * 0.4,
          kind: NOTE_KINDS[Math.floor(rand(id + 5) * NOTE_KINDS.length)],
          tx: snap(tx, cw * 2) + cw / 2, ty: snap(ty, ch) + ch / 2, born: performance.now(),
        };
        notes.push(n); fed.add(n);
      }
    }
    const k = 1 - Math.exp(-dt * 12);
    for (const b of notes) {
      if (!fed.has(b)) b.life -= dt / 2.4;
      b.target *= Math.exp(-dt * 0.7);
      b.size += (Math.max(b.target, 22) - b.size) * k;
    }
    notes = notes.filter(b => b.life > 0);

    // recall when hovering the memory band
    const inMem = p && p[0] > MEM_X0 * cssW && p[0] < MEM_X1 * cssW && p[1] > bandY0 * cssH && p[1] < bandY1 * cssH;
    if (inMem) {
      const [cw, ch] = cellCss;
      const kx = Math.floor(p[0] / (cw * 6)), ky = Math.floor(p[1] / (ch * 3));
      const key = kx * 1000 + ky;
      if (key !== recall.key) {
        recall.key = key;
        recall.conf = 0.62 + rand(key) * 0.35;
        recall.srcs = [0, 1, 2].map(i => ({
          x: snap((0.04 + rand(key + i * 7.3) * 0.3) * cssW, cw),
          y: snap((0.07 + rand(key + i * 3.7 + 1) * 0.86) * cssH, ch) + ch / 2,
          w: 4 + Math.floor(rand(key + i) * 5),
          matter: String(Math.floor(rand(key + i * 1.9) * 9000) + 1000),
        }));
      }
      recall.x = p[0]; recall.y = p[1];
    }
    recall.a += ((inMem ? 1 : 0) - recall.a) * (1 - Math.exp(-dt * (inMem ? 14 : 6)));
  }

  function roundRectPath(x, y, w, h) { octx.beginPath(); octx.rect(x, y, w, h); }

  function drawOverlay(cssW, cssH) {
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.clearRect(0, 0, W, H);
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const [cw, ch] = cellCss;
    const px = 1 / dpr;
    const ink = '#1C1B19', mem = '#39483D', amber = 'rgba(231,178,108,';
    octx.lineWidth = px;
    octx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
    octx.textBaseline = 'bottom';

    // memory band corner brackets
    const bx0 = snap(MEM_X0 * cssW, cw) - cw, bx1 = Math.ceil(MEM_X1 * cssW / cw) * cw;
    const by0 = snap(bandY0 * cssH, ch) - ch * 0.5, by1 = Math.ceil(bandY1 * cssH / ch) * ch + ch * 0.5;
    const L = 10;
    octx.strokeStyle = mem; octx.globalAlpha = 0.7;
    octx.beginPath();
    for (const [x, y, sx, sy] of [[bx0, by0, 1, 1], [bx1, by0, -1, 1], [bx0, by1, 1, -1], [bx1, by1, -1, -1]]) {
      octx.moveTo(x + sx * L, y + px / 2 * sy); octx.lineTo(x, y + px / 2 * sy); octx.lineTo(x, y + sy * L);
    }
    octx.stroke();
    octx.globalAlpha = 1;

    // notes: highlighted spans in the workspace, each written to a slot in memory
    const sorted = [...notes].sort((a, b) => a.id - b.id);
    for (const b of sorted) {
      const a = Math.min(1, b.life * 2.5);
      const w = b.size, h = b.size * b.aspect;
      const x0 = snap(b.x - w / 2, cw), y0 = snap(b.y - h / 2, ch);
      const x1 = Math.ceil((b.x + w / 2) / cw) * cw, y1 = Math.ceil((b.y + h / 2) / ch) * ch;
      // thread to memory
      const sx = x1, sy = (y0 + y1) / 2;
      const grow = Math.min(1, (performance.now() - b.born) / 450);
      const ex = sx + (b.tx - sx) * grow, ey = sy + (b.ty - sy) * grow;
      octx.globalAlpha = a * 0.75;
      octx.strokeStyle = mem;
      octx.setLineDash([2, 3]);
      octx.beginPath();
      octx.moveTo(sx, sy);
      octx.bezierCurveTo(sx + (ex - sx) * 0.5, sy, sx + (ex - sx) * 0.5, ey, ex, ey);
      octx.stroke();
      octx.setLineDash([]);
      // box
      octx.fillStyle = amber + (0.16 * a) + ')';
      octx.fillRect(x0, y0, x1 - x0, y1 - y0);
      octx.globalAlpha = a;
      octx.strokeStyle = ink;
      octx.strokeRect(x0 + px / 2, y0 + px / 2, x1 - x0 - px, y1 - y0 - px);
      octx.fillStyle = ink;
      octx.fillText(`note ${String(b.id).padStart(2, '0')} · ${b.kind}`, x0, y0 - 3);
    }

    // recall: memory points back at the documents it came from
    if (recall.a > 0.01) {
      const a = recall.a;
      octx.globalAlpha = a;
      for (const s of recall.srcs) {
        const sw = s.w * cw;
        octx.strokeStyle = ink; octx.globalAlpha = a * 0.55;
        octx.beginPath();
        octx.moveTo(recall.x, recall.y);
        const mx = (recall.x + s.x + sw) / 2;
        octx.bezierCurveTo(mx, recall.y, mx, s.y, s.x + sw, s.y);
        octx.stroke();
        octx.globalAlpha = a;
        octx.strokeRect(s.x - cw + px / 2, s.y - ch + px / 2, sw + cw * 2 - px, ch * 2 - px);
        octx.fillStyle = ink;
        octx.fillText(`src · matter ${s.matter}`, s.x - cw, s.y - ch - 3);
      }
      octx.fillStyle = mem;
      octx.fillText(`recall · conf ${recall.conf.toFixed(2)}`, recall.x + 10, recall.y - 8);
      octx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------- loop
  let raf = 0, running = false, last = 0, time = 0, run = 0, lastEpoch = -1;
  const ptsBuf = new Float32Array(32);
  const marksBuf = new Float32Array(32);

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 1 / 20);
    last = now;
    const slow = reduceMotion ? 0.3 : 1;
    time += dt * slow;
    run += dt * slow;
    const cssW = W / dpr, cssH = H / dpr;

    // ghost reader when idle: wanders the workspace, occasionally recalls from memory
    if (CFG.autoplay && !reduceMotion && now - lastInput > 2500 && !inside) {
      const s = now / 1000;
      const g = [cssW * (0.42 + 0.4 * Math.sin(s * 0.37)), cssH * (0.5 + 0.3 * Math.sin(s * 0.83 + 1.3))];
      pending.push(g); pointer = g;
    } else if (!inside && pending.length === 0) pointer = null;

    let path = pending; pending = [];
    if (lastPt && path.length) path = [lastPt, ...path];
    if (path.length > 16) {
      const step = (path.length - 1) / 15, out = [];
      for (let i = 0; i < 16; i++) out.push(path[Math.round(i * step)]);
      path = out;
    }
    let len = 0;
    for (let i = 1; i < path.length; i++) len += Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
    if (path.length) lastPt = path[path.length - 1];
    const v = len / cssH / Math.max(dt, 1 / 240);
    for (let i = 0; i < path.length; i++) {
      ptsBuf[i * 2] = path[i][0] / cssW;
      ptsBuf[i * 2 + 1] = 1 - path[i][1] / cssH;
    }

    // RL schedule: each epoch a reward pass sweeps memory; knowledge fills in and saturates
    const epoch = Math.floor(run / CFG.epochSec);
    const phase = run - epoch * CFG.epochSec;
    const sweep = phase < 1.4 ? MEM_X0 + (phase / 1.4) * (MEM_X1 - MEM_X0) : -1;
    const prog = 0.3 + 0.64 * (1 - Math.exp(-run / 60));
    if (epoch !== lastEpoch) {
      lastEpoch = epoch;
      const reward = 0.12 + 0.74 * (1 - Math.exp(-epoch / 10)) + (rand(epoch) - 0.5) * 0.04;
      epochEl.textContent = `epoch ${String(epoch).padStart(3, '0')} · reward ${reward.toFixed(3)}`;
    }

    updateNotes(pointer, v, dt, cssW, cssH);

    // marks for the shader
    marksBuf.fill(0);
    let mi = 0;
    for (const n of notes) {
      if (mi >= 8) break;
      const grow = Math.min(1, (now - n.born) / 450);
      marksBuf.set([n.tx / cssW, n.ty / cssH, Math.min(1, n.life * 2.5) * grow, 0.6], mi++ * 4);
    }
    if (recall.a > 0.01) for (const s of recall.srcs) {
      if (mi >= 8) break;
      marksBuf.set([(s.x + s.w * cellCss[0] / 2) / cssW, s.y / cssH, recall.a, s.w / 2], mi++ * 4);
    }

    // trail pass
    const src = trail[ping], dst = trail[ping ^ 1];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
    gl.viewport(0, 0, trailW, trailH);
    gl.useProgram(trailProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(trailProg.u.uPrev, 0);
    gl.uniform2fv(trailProg.u.uPts, ptsBuf);
    gl.uniform1i(trailProg.u.uN, path.length);
    gl.uniform1f(trailProg.u.uAspect, W / H);
    gl.uniform1f(trailProg.u.uRadius, CFG.trailRadius);
    gl.uniform1f(trailProg.u.uDecay, Math.pow(CFG.trailDecay, dt * 60));
    gl.uniform1f(trailProg.u.uSpeed, Math.min(1, v / 1.5));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    ping ^= 1;

    // main pass
    const u = mainProg.u;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(mainProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dst.tex);
    gl.uniform1i(u.uTrail, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.uniform1i(u.uAtlas, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, wordsTex);
    gl.uniform1i(u.uWords, 2);
    gl.uniform2f(u.uRes, W, H);
    gl.uniform2f(u.uCellPx, cellPx[0], cellPx[1]);
    gl.uniform1f(u.uTime, time);
    gl.uniform1f(u.uFlow, CFG.flow);
    gl.uniform1f(u.uAspect, W / H);
    gl.uniform1f(u.uDisplace, CFG.displace);
    gl.uniform1f(u.uProg, prog);
    gl.uniform1f(u.uSweep, sweep);
    gl.uniform2f(u.uMouse, pointer ? pointer[0] / cssW : -10, pointer ? pointer[1] / cssH : -10);
    gl.uniform1f(u.uMouseOn, pointer ? 1 : 0);
    gl.uniform4fv(u.uMarks, marksBuf);
    gl.uniform3fv(u.uPaper, CFG.paper);
    gl.uniform3fv(u.uRaw, CFG.raw);
    gl.uniform3fv(u.uInk, CFG.ink);
    gl.uniform3fv(u.uMem, CFG.mem);
    gl.uniform3fv(u.uAmber, CFG.amber);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    drawOverlay(cssW, cssH);
  }

  function start() { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }
  let visible = true;
  const sync = () => (visible && !document.hidden ? start() : stop());
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }).observe(hero);
  document.addEventListener('visibilitychange', sync);
  new ResizeObserver(resize).observe(hero);
  resize();
  sync();
})();
</script>
</body>
</html>
